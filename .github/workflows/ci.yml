name: CI

on:
  # Solo ramas: un tag lo publica el workflow Release, así que el push de un tag
  # no compila el instalador dos veces.
  push:
    branches:
      - '**'
  pull_request:
  # Nocturno: main corre las tres suites, incluida la de alemán.
  schedule:
    - cron: '30 3 * * *'
  workflow_dispatch:
    inputs:
      run_installed_e2e:
        description: 'Ejecutar E2E sobre la app instalada (requiere escritorio interactivo)'
        required: false
        default: false
        type: boolean
      adblock_offline:
        description: 'Simular que el runner no tiene red en el E2E de adblock (debe quedar verde con «Omitido (sin red)»)'
        required: false
        default: false
        type: boolean

permissions:
  contents: read
  pull-requests: write

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  # Un dispatch sobre una rama no puede cancelar el check del PR: solo un push
  # nuevo cancela la corrida anterior de la misma referencia.
  cancel-in-progress: ${{ github.event_name == 'push' }}

jobs:
  # Veredicto rápido: lint y unitarios sin esperar al build ni al E2E. Corre en
  # paralelo con `windows`, y `requerido` sigue siendo el check que protege
  # `main`, así que separar no relaja la puerta de merge.
  checks:
    name: Checks - lint, pruebas y cobertura
    runs-on: ${{ (github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name != github.repository) && 'windows-latest' || vars.TERMINUS_CI_RUNNER || 'windows-latest' }}
    timeout-minutes: 15

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Configurar Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm

      - name: Validar workflows con actionlint
        shell: pwsh
        timeout-minutes: 5
        run: |
          $ErrorActionPreference = 'Stop'
          $version = '1.7.12'
          $expectedSha256 = '6e7241b51e6817ea6a047693d8e6fed13b31819c9a0dd6c5a726e1592d22f6e9'
          $zip = Join-Path $env:RUNNER_TEMP "actionlint_$version.zip"
          $binDir = Join-Path $env:RUNNER_TEMP "actionlint_$version"

          Invoke-WebRequest -Uri "https://github.com/rhysd/actionlint/releases/download/v$version/actionlint_${version}_windows_amd64.zip" -OutFile $zip
          $actualSha256 = (Get-FileHash -Algorithm SHA256 -LiteralPath $zip).Hash.ToLowerInvariant()
          if ($actualSha256 -ne $expectedSha256) {
            throw "Checksum de actionlint inválido: $actualSha256 (esperado $expectedSha256)."
          }

          New-Item -ItemType Directory -Force -Path $binDir | Out-Null
          Expand-Archive -LiteralPath $zip -DestinationPath $binDir -Force
          & (Join-Path $binDir 'actionlint.exe') -color

      - name: Instalar dependencias
        run: npm ci

      - name: Typecheck y ESLint
        run: npm run lint

      - name: Pruebas unitarias con cobertura
        run: npm run test:coverage

      - name: Publicar cobertura
        uses: actions/upload-artifact@v7
        with:
          name: coverage-lcov
          path: coverage/lcov.info
          if-no-files-found: error

      - name: Auditar dependencias (incluye desarrollo)
        run: npm audit --audit-level=moderate

      - name: Instalar Chromium para Playwright
        run: npx playwright install chromium

      - name: Prueba Chromium del sandbox Python
        run: npm run test:e2e:python-sandbox

  windows:
    name: Windows - build, E2E y artefactos
    outputs:
      pr_comment_url: ${{ steps.pr_summary.outputs.comment_url }}
    # El E2E usa SendKeys y necesita escritorio interactivo: lo comprueba el
    # preflight, no la etiqueta del runner, así que en windows-latest puede pasar.
    # Para ejecuciones repetidas conviene TERMINUS_CI_RUNNER con un runner propio.
    # Un PR desde un fork nunca usa un runner autoalojado: podría ejecutar
    # código no confiable en una máquina con acceso a la red local.
    runs-on: ${{ (github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name != github.repository) && 'windows-latest' || vars.TERMINUS_CI_RUNNER || 'windows-latest' }}
    timeout-minutes: 40

    env:
      # La firma es opcional: sin el secreto, electron-builder genera un instalador sin firmar.
      SIGNING_ENABLED: ${{ secrets.WINDOWS_CERTIFICATE_BASE64 != '' }}

    steps:
      - name: Registrar inicio del job
        id: job_start
        shell: pwsh
        run: |
          "started_at=$((Get-Date).ToUniversalTime().ToString('o'))" | Out-File -FilePath $env:GITHUB_OUTPUT -Append -Encoding utf8

      - name: Checkout
        uses: actions/checkout@v7

      # Decide si el E2E instalado corre en esta ejecución y con qué suites.
      # Un PR del propio repositorio que toca código de la app lo ejecuta (sin la
      # suite de alemán); el nocturno de main corre todas.
      - name: Decidir si corre el E2E instalado
        id: e2e_gate
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
          EVENT_NAME: ${{ github.event_name }}
          REPO: ${{ github.repository }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
          PR_HEAD_REPO: ${{ github.event.pull_request.head.repo.full_name }}
          DISPATCH_E2E: ${{ github.event.inputs.run_installed_e2e }}
          INSTALLED_E2E_VAR: ${{ vars.TERMINUS_RUN_INSTALLED_E2E }}
        run: |
          $ErrorActionPreference = 'Stop'
          $enabled = $false
          $only = ''
          $reason = ''

          if ($env:EVENT_NAME -eq 'schedule') {
            $enabled = $true
            $reason = 'nocturno de main'
          } elseif ($env:EVENT_NAME -eq 'workflow_dispatch') {
            $enabled = $env:DISPATCH_E2E -eq 'true'
            $reason = 'dispatch'
          } elseif ($env:EVENT_NAME -eq 'pull_request') {
            if ($env:PR_HEAD_REPO -ne $env:REPO) {
              $reason = 'PR desde un fork'
            } else {
              # Solo cuando el PR toca lo que se empaqueta; si la API falla, se ejecuta.
              $appChanged = $true
              $pattern = '^(src/|electron/|scripts/|assets/|index\.html$|package(-lock)?\.json$|vite\.config\.|vitest\.config\.|tsconfig[^/]*\.json$|electron-builder)'
              $files = @(gh api --paginate "repos/$($env:REPO)/pulls/$($env:PR_NUMBER)/files" --jq '.[].filename' 2>$null)
              if ($LASTEXITCODE -eq 0 -and $files.Count -gt 0) {
                $appChanged = @($files | Where-Object { $_ -match $pattern }).Count -gt 0
              }
              $enabled = $appChanged
              # La suite de alemán solo en main: es la misma UI y dobla el tiempo del PR.
              $only = 'ctrl-f,ui'
              $reason = if ($appChanged) { 'PR que toca la app' } else { 'PR sin cambios de app' }
            }
          } else {
            $enabled = $env:INSTALLED_E2E_VAR -eq 'true'
            $reason = 'push'
          }

          "enabled=$($enabled.ToString().ToLower())" | Out-File -FilePath $env:GITHUB_OUTPUT -Append -Encoding utf8
          "only=$only" | Out-File -FilePath $env:GITHUB_OUTPUT -Append -Encoding utf8
          Write-Host "E2E instalado: $($enabled.ToString().ToLower()) ($reason)"

      - name: Configurar Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm

      - name: Obtener versión de la app
        id: version
        shell: pwsh
        run: |
          $version = (Get-Content -LiteralPath package.json -Raw | ConvertFrom-Json).version
          if (-not $version) {
            throw 'No se pudo leer la versión de package.json.'
          }
          "version=$version" | Out-File -FilePath $env:GITHUB_OUTPUT -Append -Encoding utf8

      - name: Preflight de sesión interactiva del E2E
        if: steps.e2e_gate.outputs.enabled == 'true'
        timeout-minutes: 1
        shell: pwsh
        run: |
          $sessionId = (Get-Process -Id $PID).SessionId
          if ($sessionId -eq 0) {
            throw "El E2E instalado requiere una sesión interactiva, pero el runner está en la sesión 0. Arranca el runner con run.cmd en una sesión de escritorio, no con svc.cmd. Consulta docs/e2e-installed-windows.md."
          }
          if (-not [Environment]::UserInteractive) {
            throw "El E2E instalado requiere [Environment]::UserInteractive = true. Revisa la sesión del runner y consulta docs/e2e-installed-windows.md."
          }
          Write-Host "Sesión interactiva detectada: SessionId=$sessionId"

      # El build necesita las dependencias; `checks` instala las suyas en paralelo.
      - name: Instalar dependencias
        run: npm ci

      - name: Preparar certificado de firma
        if: env.SIGNING_ENABLED == 'true'
        shell: pwsh
        env:
          WINDOWS_CERTIFICATE_BASE64: ${{ secrets.WINDOWS_CERTIFICATE_BASE64 }}
        run: |
          $ErrorActionPreference = 'Stop'
          if ([string]::IsNullOrWhiteSpace($env:WINDOWS_CERTIFICATE_BASE64)) {
            throw 'WINDOWS_CERTIFICATE_BASE64 está vacío.'
          }

          try {
            $bytes = [Convert]::FromBase64String($env:WINDOWS_CERTIFICATE_BASE64)
          } catch {
            throw 'WINDOWS_CERTIFICATE_BASE64 no es un PFX codificado en base64 válido.'
          }
          if ($bytes.Length -eq 0) {
            throw 'El certificado de firma está vacío.'
          }

          $certificatePath = Join-Path $env:RUNNER_TEMP 'terminus-signing.pfx'
          [IO.File]::WriteAllBytes($certificatePath, $bytes)
          "WIN_CSC_LINK=$certificatePath" | Out-File -FilePath $env:GITHUB_ENV -Append -Encoding utf8
          Write-Host 'Certificado preparado para firmar el instalador.'

      - name: Compilar instalador NSIS
        env:
          WIN_CSC_KEY_PASSWORD: ${{ secrets.WINDOWS_CERTIFICATE_PASSWORD }}
        run: npm run desktop:build

      - name: Verificar firma del instalador
        if: env.SIGNING_ENABLED == 'true'
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $installer = Get-ChildItem -LiteralPath release -Filter 'Terminus Setup *.exe' |
            Where-Object { $_.Name -notlike '*.__uninstaller.exe' } |
            Sort-Object LastWriteTime -Descending |
            Select-Object -First 1
          if (-not $installer) {
            throw 'No se generó el instalador NSIS.'
          }

          $signature = Get-AuthenticodeSignature -LiteralPath $installer.FullName
          Write-Host "Instalador: $($installer.FullName)"
          Write-Host "Estado de firma: $($signature.Status)"
          Write-Host "Firmante: $($signature.SignerCertificate.Subject)"
          Write-Host "Sello de tiempo: $($signature.TimeStamperCertificate.Subject)"

          if ($signature.Status -ne 'Valid') {
            throw "La firma del instalador no es válida: $($signature.Status) - $($signature.StatusMessage)"
          }
          if (-not $signature.SignerCertificate) {
            throw 'El instalador no tiene certificado de firma.'
          }
          if (-not $signature.TimeStamperCertificate) {
            throw 'El instalador no tiene sello de tiempo; la firma caducará con el certificado.'
          }

      - name: Eliminar certificado temporal
        if: always() && env.SIGNING_ENABLED == 'true'
        shell: pwsh
        run: |
          $certificatePath = Join-Path $env:RUNNER_TEMP 'terminus-signing.pfx'
          Remove-Item -LiteralPath $certificatePath -Force -ErrorAction SilentlyContinue

      # El E2E de adblock lanza Playwright contra `release/win-unpacked`, así que va
      # justo después del build y antes de instalar: no depende del gate del E2E
      # instalado ni de una sesión de escritorio interactiva.
      # Código 2 = el runner no alcanzó example.com o las listas de EasyList. Eso no
      # dice nada del producto: se avisa y el job sigue verde. Cualquier otro código
      # sigue siendo un fallo, así que una regresión real no se puede colar.
      - name: E2E de adblock en Electron
        id: e2e_adblock
        timeout-minutes: 12
        shell: pwsh
        env:
          # Solo lo rellena un dispatch con la casilla marcada; en el resto, vacío.
          ADBLOCK_OFFLINE: ${{ github.event.inputs.adblock_offline }}
        run: |
          # Ensayo del camino sin red, sin cortar la red del runner: el guion recibe
          # un destino inalcanzable y tiene que salir con código 2.
          if ($env:ADBLOCK_OFFLINE -eq 'true') {
            $env:TERMINUS_E2E_ADBLOCK_PROBE_URLS = 'http://127.0.0.1:9/'
            'forced=true' | Out-File -FilePath $env:GITHUB_OUTPUT -Append -Encoding utf8
            Write-Host 'Ensayo sin red: TERMINUS_E2E_ADBLOCK_PROBE_URLS=http://127.0.0.1:9/'
          }
          # El guion escribe su propia salida en `artifacts/e2e/adblock-electron.log`
          # (UTF-8), así que el artefacto lleva el diagnóstico sin depender del shell.
          npm run test:e2e:adblock
          $code = $LASTEXITCODE
          if ($code -eq 2) {
            'skipped=true' | Out-File -FilePath $env:GITHUB_OUTPUT -Append -Encoding utf8
            $reason = if ($env:ADBLOCK_OFFLINE -eq 'true') {
              'Ensayo sin red pedido con workflow_dispatch (destino inalcanzable, código 2); el comportamiento es el de un runner sin red.'
            } else {
              'El runner no alcanzó example.com o las listas de EasyList (código 2); no se puede distinguir una regresión de un fallo de red.'
            }
            Write-Host "::warning title=E2E de adblock omitido::$reason"
            exit 0
          }
          exit $code

      # El artefacto lleva la captura y el log del paso; se suben aunque el paso falle,
      # que es justo cuando hacen falta.
      - name: Publicar captura del E2E de adblock
        id: upload-adblock
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: e2e-adblock
          path: |
            artifacts/adblock-electron.png
            artifacts/e2e/adblock-electron.log
          if-no-files-found: ignore

      # El artefacto lleva el instalador suelto, no un ZIP propio: Actions envuelve el
      # fichero en su propio zip al descargarlo, y por eso el tamaño descargado no
      # coincide con el del .exe. El ZIP de release se arma a mano con Compress-Archive
      # desde ese mismo .exe y no se reproduce byte a byte en CI (cada empaquetado deja
      # marcas de tiempo y orden distintos). Lo que sí es idéntico es el .exe, y eso es
      # lo que verifican los hashes de SHA256SUMS.txt.
      - name: Publicar instalador
        id: upload-installer
        uses: actions/upload-artifact@v7
        with:
          name: terminus-installer-${{ steps.version.outputs.version }}-run-${{ github.run_number }}-windows
          path: release/Terminus Setup *.exe
          if-no-files-found: error

      # El formato de los hashes y las notas vive en un helper que comparte con el
      # workflow de release, para que no haya dos versiones del mismo fichero.
      - name: Generar SHA256SUMS.txt
        id: sha256sums
        run: node scripts/release-artifacts.cjs --tag "v${{ steps.version.outputs.version }}"

      - name: Publicar SHA256SUMS.txt
        id: upload-sha256sums
        uses: actions/upload-artifact@v7
        with:
          name: terminus-sha256sums-${{ steps.version.outputs.version }}-run-${{ github.run_number }}-windows
          path: release/SHA256SUMS.txt
          if-no-files-found: error

      - name: Instalar el build actual
        if: steps.e2e_gate.outputs.enabled == 'true'
        shell: pwsh
        run: |
          $installer = Get-ChildItem -LiteralPath release -Filter 'Terminus Setup *.exe' |
            Sort-Object LastWriteTime -Descending |
            Select-Object -First 1
          if (-not $installer) {
            throw 'No se generó el instalador NSIS.'
          }

          Write-Host "Instalando $($installer.FullName)"
          $process = Start-Process -FilePath $installer.FullName -ArgumentList '/S' -Wait -PassThru
          if ($process.ExitCode -ne 0) {
            throw "El instalador terminó con código $($process.ExitCode)."
          }

          $exe = Join-Path $env:LOCALAPPDATA 'Programs\Terminus\Terminus.exe'
          if (-not (Test-Path -LiteralPath $exe)) {
            throw "No se encontró la app instalada en $exe."
          }

          # NSIS puede abrir la app al terminar; el E2E necesita arrancar su propia instancia.
          Get-Process -Name Terminus -ErrorAction SilentlyContinue |
            Stop-Process -Force -ErrorAction SilentlyContinue
          Start-Sleep -Seconds 2

          "TERMINUS_INSTALLED_EXE=$exe" | Out-File -FilePath $env:GITHUB_ENV -Append -Encoding utf8

      - name: E2E en la app instalada
        id: e2e
        if: steps.e2e_gate.outputs.enabled == 'true'
        timeout-minutes: 10
        shell: pwsh
        run: node scripts/e2e-run.mjs --only "${{ steps.e2e_gate.outputs.only }}"

      - name: Publicar logs del E2E
        id: upload-e2e-logs
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: e2e-installed-logs
          path: |
            artifacts/e2e/e2e-installed.log
            artifacts/e2e/e2e-installed-ui.log
            artifacts/e2e/e2e-installed-ui-de.log
            artifacts/e2e/*.png
          # El E2E instalado es opcional: sin log no hay nada que subir y no debe avisar.
          if-no-files-found: ignore

      - name: Resumen de artefactos
        if: always()
        shell: pwsh
        env:
          APP_VERSION: ${{ steps.version.outputs.version }}
          JOB_STATUS: ${{ job.status }}
          JOB_STARTED_AT: ${{ steps.job_start.outputs.started_at }}
          E2E_RESULT: ${{ steps.e2e.outputs.result }}
          E2E_EXIT_CODE: ${{ steps.e2e.outputs.exit_code }}
          E2E_OUTCOME: ${{ steps.e2e.outcome }}
          E2E_STEPS: ${{ steps.e2e.outputs.steps }}
          RUNNER_NAME: ${{ runner.name }}
          RUNNER_ENVIRONMENT: ${{ runner.environment }}
          RUN_NUMBER: ${{ github.run_number }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
          INSTALLER_NAME: terminus-installer-${{ steps.version.outputs.version }}-run-${{ github.run_number }}-windows
          INSTALLER_URL: ${{ steps.upload-installer.outputs.artifact-url }}
          LOGS_URL: ${{ steps.upload-e2e-logs.outputs.artifact-url }}
          SUMS_NAME: terminus-sha256sums-${{ steps.version.outputs.version }}-run-${{ github.run_number }}-windows
          SUMS_URL: ${{ steps.upload-sha256sums.outputs.artifact-url }}
          ADBLOCK_OUTCOME: ${{ steps.e2e_adblock.outcome }}
          ADBLOCK_SKIPPED: ${{ steps.e2e_adblock.outputs.skipped }}
          ADBLOCK_FORCED: ${{ steps.e2e_adblock.outputs.forced }}
          ADBLOCK_URL: ${{ steps.upload-adblock.outputs.artifact-url }}
        run: |
          $version = if ($env:APP_VERSION) { $env:APP_VERSION } else { 'desconocida' }
          $status = if ($env:JOB_STATUS) { $env:JOB_STATUS } else { 'desconocido' }
          $statusLabel = switch ($status) {
            'success' { 'Éxito' }
            'failure' { 'Fallo' }
            'cancelled' { 'Cancelado' }
            default { $status }
          }
          $e2eText = if ($env:E2E_OUTCOME -eq 'skipped') {
            'No ejecutado'
          } elseif ($env:E2E_EXIT_CODE) {
            "$($env:E2E_RESULT) (código $($env:E2E_EXIT_CODE))"
          } else {
            'FAIL'
          }
          $e2eStepsText = if ($env:E2E_STEPS) { $env:E2E_STEPS } else { 'No disponible' }
          $startedAtRaw = $env:JOB_STARTED_AT
          if ($startedAtRaw) {
            $startedAt = [datetime]::Parse(
              $startedAtRaw,
              [System.Globalization.CultureInfo]::InvariantCulture,
              [System.Globalization.DateTimeStyles]::RoundtripKind
            )
            $duration = [datetime]::UtcNow - $startedAt.ToUniversalTime()
            $hours = [int][math]::Floor($duration.TotalHours)
            $durationText = '{0:00}:{1:00}:{2:00}' -f $hours, $duration.Minutes, $duration.Seconds
          } else {
            $durationText = 'desconocida'
          }
          # El preflight solo prueba que hay escritorio, no de qué runner se trata.
          $runnerKind = if ($env:RUNNER_ENVIRONMENT -eq 'self-hosted') { 'autoalojado' } else { 'alojado por GitHub' }
          $e2eRunnerText = if ($env:E2E_OUTCOME -eq 'skipped') {
            "No ejecutado (job en $($env:RUNNER_NAME), $runnerKind)"
          } else {
            "$($env:RUNNER_NAME) ($runnerKind)"
          }
          $installerLink = if ($env:INSTALLER_URL) { "[Descargar]($env:INSTALLER_URL)" } else { 'No disponible' }
          $logsLink = if ($env:LOGS_URL) { "[Descargar]($env:LOGS_URL)" } else { 'No disponible' }
          $sumsLink = if ($env:SUMS_URL) { "[Descargar]($env:SUMS_URL)" } else { 'No disponible' }
          $adblockLink = if ($env:ADBLOCK_URL) { "[Captura]($env:ADBLOCK_URL)" } else { 'sin captura' }
          $adblockText = if ($env:ADBLOCK_SKIPPED -eq 'true' -and $env:ADBLOCK_FORCED -eq 'true') {
            "Omitido (sin red) - ensayo con workflow_dispatch - $adblockLink"
          } elseif ($env:ADBLOCK_SKIPPED -eq 'true') {
            "Omitido (sin red) - $adblockLink"
          } elseif ($env:ADBLOCK_OUTCOME -eq 'success') {
            "OK - $adblockLink"
          } elseif ($env:ADBLOCK_OUTCOME -eq 'failure') {
            "FAIL - $adblockLink"
          } else {
            'No ejecutado'
          }

          $lines = @(
            '## Terminus CI',
            '',
            "- **Versión:** $version",
            "- **Estado:** $statusLabel",
            "- **E2E:** $e2eText",
            "- **Runner del E2E:** $e2eRunnerText",
            "- **Pasos del E2E:** $e2eStepsText",
            "- **Duración:** $durationText",
            "- **Ejecución:** [$env:RUN_NUMBER]($env:RUN_URL)",
            "- **Instalador:** $env:INSTALLER_NAME - $installerLink",
            "- **E2E adblock:** $adblockText",
            "- **Logs E2E:** e2e-installed-logs - $logsLink",
            "- **Sumas SHA-256:** $env:SUMS_NAME - $sumsLink",
            ''
          )
          $lines | Out-File -FilePath $env:GITHUB_STEP_SUMMARY -Append -Encoding utf8
          # El resumen de la web no se lee sin sesión, así que también va al log.
          $lines | Write-Output

      # En PRs desde forks el GITHUB_TOKEN es de solo lectura; se omite el comentario.
      # Solo se publica cuando alguna fase anterior ha fallado.
      - name: Publicar resumen en el PR
        id: pr_summary
        if: failure() && github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name == github.repository
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
          REPO: ${{ github.repository }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          $summaryPath = $env:GITHUB_STEP_SUMMARY
          $summary = if ($summaryPath -and (Test-Path -LiteralPath $summaryPath -PathType Leaf)) {
            Get-Content -Raw -LiteralPath $summaryPath
          } else {
            $null
          }
          if ([string]::IsNullOrWhiteSpace($summary)) {
            Write-Warning 'No se encontró el resumen; se publicará un comentario mínimo.'
            $summary = "## Terminus CI`n`nNo se pudo generar el resumen del workflow."
            if ($env:RUN_URL) {
              $summary += "`n`n[Ver la ejecución]($env:RUN_URL)"
            }
          }

          $bodyPath = Join-Path $env:RUNNER_TEMP 'terminus-ci-summary.md'
          $marker = '<!-- terminus-ci-summary -->'
          $body = $marker + "`n" + $summary
          $utf8NoBom = [System.Text.UTF8Encoding]::new($false)
          [System.IO.File]::WriteAllText($bodyPath, $body, $utf8NoBom)

          $commentId = gh api --paginate "repos/$env:REPO/issues/$env:PR_NUMBER/comments" --jq '.[] | select(.user.login == "github-actions[bot]" and (.body | contains("<!-- terminus-ci-summary -->"))) | .id' | Select-Object -First 1
          if ($commentId) {
            $commentId = $commentId.Trim()
            $payloadPath = Join-Path $env:RUNNER_TEMP 'terminus-ci-summary.json'
            $payload = @{ body = $body } | ConvertTo-Json -Compress
            [System.IO.File]::WriteAllText($payloadPath, $payload, $utf8NoBom)
            $response = gh api --method PATCH "repos/$env:REPO/issues/comments/$commentId" --input $payloadPath | ConvertFrom-Json
            $commentUrl = $response.html_url
            $commentAction = 'actualizado'
            Write-Host "Comentario del resumen actualizado: $commentId"
          } else {
            $commentUrl = gh pr comment $env:PR_NUMBER --body-file $bodyPath | Where-Object { $_ } | Select-Object -Last 1
            $commentAction = 'creado'
          }
          if (-not $commentUrl) {
            $commentUrl = "https://github.com/$env:REPO/pull/$env:PR_NUMBER"
          }
          $commentUrl = $commentUrl.Trim()
          "comment_url=$commentUrl" | Out-File -FilePath $env:GITHUB_OUTPUT -Append -Encoding utf8
          Write-Host "Comentario del resumen ${commentAction}: $commentUrl"
          if ($env:GITHUB_STEP_SUMMARY) {
            "- **Comentario del PR:** [Ver resumen]($commentUrl)" | Out-File -FilePath $env:GITHUB_STEP_SUMMARY -Append -Encoding utf8
          }

  # El contexto que exige la protección de `main` se mantiene con este job
  # agregado: si `checks` o `windows` fallan, este check falla igual que antes
  # de partir el trabajo, así que la regla de merge no cambia.
  requerido:
    name: Windows - lint, tests, cobertura y E2E opcional
    needs: [checks, windows]
    if: always()
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      pr_comment_url: ${{ needs.windows.outputs.pr_comment_url }}

    steps:
      - name: Comprobar el resultado de los dos jobs
        shell: bash
        env:
          CHECKS_RESULT: ${{ needs.checks.result }}
          WINDOWS_RESULT: ${{ needs.windows.result }}
        run: |
          echo "checks: $CHECKS_RESULT"
          echo "windows: $WINDOWS_RESULT"
          fallo=0
          for resultado in "$CHECKS_RESULT" "$WINDOWS_RESULT"; do
            case "$resultado" in
              success|skipped) ;;
              *) fallo=1 ;;
            esac
          done
          if [ "$fallo" -ne 0 ]; then
            echo "::error title=CI en rojo::checks=$CHECKS_RESULT, windows=$WINDOWS_RESULT"
            exit 1
          fi
          echo "Los dos jobs pasaron."

name: Release

# Un tag de versión publica el instalador que genera el mismo comando que usa el
# CI (`npm run desktop:build`), con sus hashes y notas. El CI de push solo corre
# en ramas, así que un tag no compila dos veces.
#
# Antes de publicar, el job instala ese mismo instalador en limpio y le pasa la
# suite Ctrl+F sobre la app instalada: si el `.exe` que se va a publicar no
# arranca o no encuentra, no hay release. Sin ese paso, la release era lo único
# que nadie probaba tal como se entrega.
on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

concurrency:
  group: release-${{ github.ref_name }}
  cancel-in-progress: false

jobs:
  windows-release:
    name: Windows - instalador y release
    # Mismo runner que el CI: en un runner autoalojado evita depender de la cuota
    # de Actions, y en windows-latest funciona sin configuración.
    runs-on: ${{ vars.TERMINUS_CI_RUNNER || 'windows-latest' }}
    timeout-minutes: 40

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Configurar Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm

      # Falla en segundos si el tag no corresponde a la versión de package.json,
      # en vez de gastar el build y publicar un instalador con otro número.
      - name: Comprobar que el tag coincide con package.json
        run: node scripts/release-artifacts.cjs --tag "${{ github.ref_name }}" --check-only

      - name: Instalar dependencias
        run: npm ci

      # La release se publica sin firma Authenticode por decisión del proyecto;
      # el flujo de firma queda documentado en docs/code-signing-windows.md.
      - name: Compilar instalador NSIS
        run: npm run desktop:build

      # `--published` copia el instalador con el nombre que GitHub admite como asset
      # (sin espacios), para que las notas y los hashes nombren el fichero real.
      # Lo que se publica es lo que se acaba de instalar: mismo binario, mismo
      # instalador NSIS que subirá el release. La instalación es silenciosa y en
      # limpio, así que cubre también el arranque que ve un usuario nuevo.
      - name: Instalar el instalador recién compilado
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $installer = Get-ChildItem -LiteralPath release -Filter 'Terminus Setup *.exe' |
            Where-Object { $_.Name -notlike '*.__uninstaller.exe' } |
            Sort-Object LastWriteTime -Descending |
            Select-Object -First 1
          if (-not $installer) {
            throw 'No se generó el instalador NSIS.'
          }

          # Una instancia abierta hace fallar al instalador; el E2E arranca la suya.
          Get-Process -Name Terminus -ErrorAction SilentlyContinue |
            Stop-Process -Force -ErrorAction SilentlyContinue
          Start-Sleep -Seconds 2

          Write-Host "Instalando $($installer.FullName)"
          $process = Start-Process -FilePath $installer.FullName -ArgumentList '/S' -Wait -PassThru
          if ($process.ExitCode -ne 0) {
            throw "El instalador terminó con código $($process.ExitCode)."
          }

          $exe = Join-Path $env:LOCALAPPDATA 'Programs\Terminus\Terminus.exe'
          if (-not (Test-Path -LiteralPath $exe)) {
            throw "No se encontró la app instalada en $exe."
          }

          # NSIS suele abrir la app al terminar; el E2E necesita lanzar la suya.
          Get-Process -Name Terminus -ErrorAction SilentlyContinue |
            Stop-Process -Force -ErrorAction SilentlyContinue
          Start-Sleep -Seconds 2

          "TERMINUS_INSTALLED_EXE=$exe" | Out-File -FilePath $env:GITHUB_ENV -Append -Encoding utf8

      - name: E2E de Ctrl+F sobre el instalador empaquetado
        id: smoke
        timeout-minutes: 10
        shell: pwsh
        run: node scripts/e2e-run.mjs --only ctrl-f

      # El log y la captura del fallo viajan con la ejecución: sin ellos, un
      # release bloqueado obliga a reproducir el problema a mano.
      - name: Publicar log del E2E del release
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: release-e2e-installed
          path: |
            artifacts/e2e/e2e-installed.log
            artifacts/e2e/*.png
          if-no-files-found: ignore

      - name: Preparar hashes y notas
        id: artifacts
        run: node scripts/release-artifacts.cjs --tag "${{ github.ref_name }}" --published

      - name: Publicar la release
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.ref_name }}
          PRERELEASE: ${{ steps.artifacts.outputs.prerelease }}
          INSTALLER: ${{ steps.artifacts.outputs.asset }}
          SUMS: ${{ steps.artifacts.outputs.sums }}
          NOTES: ${{ steps.artifacts.outputs.notes }}
          VERSION: ${{ steps.artifacts.outputs.version }}
        run: |
          $ErrorActionPreference = 'Stop'

          # Reintentar el tag reemplaza la release: los assets se vuelven a subir
          # en vez de acumular duplicados. El tag no se toca.
          gh release view $env:TAG --json tagName 2>$null | Out-Null
          if ($LASTEXITCODE -eq 0) {
            Write-Host "La release $env:TAG ya existe; se elimina para publicarla de nuevo."
            gh release delete $env:TAG --yes
          }

          $extra = @()
          if ($env:PRERELEASE -eq 'true') { $extra += '--prerelease' }
          gh release create $env:TAG $env:INSTALLER $env:SUMS `
            --title "Terminus $env:VERSION" `
            --notes-file $env:NOTES `
            @extra

          gh release view $env:TAG --json url,assets `
            --jq '"Release: " + .url + " (" + (.assets | length | tostring) + " assets)"'

      # Una subida truncada o un asset que no es el que se compiló se detectan aquí,
      # en la propia entrega, y no cuando alguien descarga el instalador.
      - name: Verificar el asset publicado
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          TAG: ${{ github.ref_name }}
          ASSET_NAME: ${{ steps.artifacts.outputs.assetName }}
          SUMS: ${{ steps.artifacts.outputs.sums }}
        run: |
          $ErrorActionPreference = 'Stop'

          $jq = '.assets[] | select(.name == "' + $env:ASSET_NAME + '") | {id, name, size}'
          $json = gh api "repos/$env:REPO/releases/tags/$env:TAG" --jq $jq
          if (-not $json) {
            throw "La release $env:TAG no publicó el asset $env:ASSET_NAME."
          }
          $asset = $json | ConvertFrom-Json

          $expected = $null
          foreach ($line in Get-Content -LiteralPath $env:SUMS) {
            $pattern = '(?i)^([0-9a-f]{64})\s+\*?' + [regex]::Escape($env:ASSET_NAME) + '\s*$'
            if ($line -match $pattern) { $expected = $Matches[1].ToLowerInvariant() }
          }
          if (-not $expected) {
            throw "$env:SUMS no tiene la línea de $env:ASSET_NAME."
          }

          # La API exige la cabecera octet-stream para devolver el binario; sin ella
          # entrega el JSON del asset.
          $path = Join-Path $env:RUNNER_TEMP (Join-Path 'release-asset' $env:ASSET_NAME)
          New-Item -ItemType Directory -Force -Path (Split-Path -Parent $path) | Out-Null
          $headers = @{
            Authorization = "Bearer $env:GH_TOKEN"
            Accept = 'application/octet-stream'
          }
          Invoke-WebRequest -Uri "https://api.github.com/repos/$env:REPO/releases/assets/$($asset.id)" -Headers $headers -OutFile $path

          $actual = (Get-FileHash -Algorithm SHA256 -LiteralPath $path).Hash.ToLowerInvariant()
          Write-Host "Asset $($asset.name): $($asset.size) bytes publicados, SHA-256 $actual"
          if ($actual -ne $expected) {
            throw "El asset publicado no coincide con $env:SUMS: esperado $expected, descargado $actual."
          }
          Write-Host "El asset publicado coincide con $env:SUMS."

      - name: Resumen de la release
        if: always()
        shell: pwsh
        env:
          TAG: ${{ github.ref_name }}
          JOB_STATUS: ${{ job.status }}
          SMOKE_OUTCOME: ${{ steps.smoke.outcome }}
          INSTALLER: ${{ steps.artifacts.outputs.asset }}
          ASSET_NAME: ${{ steps.artifacts.outputs.assetName }}
          RUN_NUMBER: ${{ github.run_number }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          $hash = if ($env:INSTALLER -and (Test-Path -LiteralPath $env:INSTALLER)) {
            (Get-FileHash -Algorithm SHA256 -LiteralPath $env:INSTALLER).Hash.ToLowerInvariant()
          } else {
            'No disponible'
          }
          $installerName = if ($env:ASSET_NAME) { $env:ASSET_NAME } else { 'No disponible' }
          $smoke = if ($env:SMOKE_OUTCOME -eq 'success') {
            'PASS (Ctrl+F sobre la app instalada)'
          } elseif ($env:SMOKE_OUTCOME) {
            "No superado ($env:SMOKE_OUTCOME)"
          } else {
            'No ejecutado'
          }
          $lines = @(
            '## Release de Terminus',
            '',
            "- **Tag:** $env:TAG",
            "- **Estado:** $env:JOB_STATUS",
            "- **Instalador:** $installerName",
            "- **SHA-256:** $hash",
            "- **Probado antes de publicar:** $smoke",
            "- **Ejecución:** [$env:RUN_NUMBER]($env:RUN_URL)",
            ''
          )
          $lines | Out-File -FilePath $env:GITHUB_STEP_SUMMARY -Append -Encoding utf8
          $lines | Write-Output
